[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pr-sentinel"
version = "0.1.0"
description = "Local-first, privacy-conscious PR review agent built on IBM Bob 2.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "gitpython>=3.1.43",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
sentinel = "pr_sentinel.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["pr_sentinel"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
